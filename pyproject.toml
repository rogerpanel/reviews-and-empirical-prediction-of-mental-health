[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlmh"
version = "0.1.0"
description = "Empirical companion to a PROBAST/TRIPOD+AI appraisal of ML models for mental health prediction: quantifying leaky splitting, missing external validation and missing calibration on public actigraphy cohorts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aminat Abiola Ajibola" }]
dependencies = [
  "numpy==2.4.6",
  "pandas==3.0.5",
  "scikit-learn==1.9.0",
  "xgboost==3.2.0",
  "imbalanced-learn==0.14.2",
  "scipy>=1.14",
  "matplotlib>=3.9",
  "pyyaml>=6.0",
  "joblib>=1.4",
]

[project.optional-dependencies]
cnn = ["torch>=2.4"]
dev = ["pytest>=8.0", "openpyxl>=3.1"]

[project.scripts]
mlmh = "mlmh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
